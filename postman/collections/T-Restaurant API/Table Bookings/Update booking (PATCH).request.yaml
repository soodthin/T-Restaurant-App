$kind: http-request
url: "{{base_url}}/api/bookings/{{booking_id}}/"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "guests": 6
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Khách đã đổi', () => pm.expect(pm.response.json().guests).to.eql(6));
    language: text/javascript
order: 4000
