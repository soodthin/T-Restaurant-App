$kind: http-request
url: "{{base_url}}/api/users/"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: first_name
      value: Test
    - type: text
      key: last_name
      value: Customer
    - type: text
      key: username
      value: pm_customer_{{$timestamp}}
    - type: text
      key: password
      value: Password@123
    - type: text
      key: email
      value: pm+{{$timestamp}}@test.local
    - type: text
      key: role
      value: customer
    - type: text
      key: phone
      value: "0900000001"
    - type: text
      key: address
      value: 123 Test street
    - type: file
      key: avatar
      src: "{{sample_image_path}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Trả id', () => pm.expect(body).to.have.property('id'));
      pm.test('Role = customer', () => pm.expect(body.role).to.eql('customer'));
      pm.test('Co thong tin lien he va avatar', () => {
          pm.expect(body.phone).to.not.be.empty;
          pm.expect(body.address).to.not.be.empty;
          pm.expect(body.avatar).to.not.be.empty;
      });
      pm.test('Không lộ password', () => pm.expect(body).to.not.have.property('password'));
      pm.environment.set('user_id', body.id);
    language: text/javascript
order: 1000
