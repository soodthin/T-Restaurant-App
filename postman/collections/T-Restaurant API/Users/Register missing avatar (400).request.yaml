$kind: http-request
url: "{{base_url}}/api/users/"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: first_name
      value: Test
    - type: text
      key: last_name
      value: MissingAvatar
    - type: text
      key: username
      value: pm_no_avatar_{{$timestamp}}
    - type: text
      key: password
      value: Password@123
    - type: text
      key: email
      value: no-avatar+{{$timestamp}}@test.local
    - type: text
      key: role
      value: customer
    - type: text
      key: phone
      value: "0900000004"
    - type: text
      key: address
      value: 101 Test street
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Bao loi avatar', () => {
          pm.expect(JSON.stringify(pm.response.json())).to.include('avatar');
      });
    language: text/javascript
order: 2600
