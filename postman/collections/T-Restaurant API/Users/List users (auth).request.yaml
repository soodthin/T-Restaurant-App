$kind: http-request
url: "{{base_url}}/api/users/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Có phân trang', () => pm.expect(body).to.have.property('results'));
    language: text/javascript
order: 4000
