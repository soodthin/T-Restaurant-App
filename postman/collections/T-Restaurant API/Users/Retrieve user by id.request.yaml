$kind: http-request
url: "{{base_url}}/api/users/{{user_id}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Đúng id', () => pm.expect(pm.response.json().id.toString()).to.eql(pm.collectionVariables.get('user_id').toString()));
    language: text/javascript
order: 8000
