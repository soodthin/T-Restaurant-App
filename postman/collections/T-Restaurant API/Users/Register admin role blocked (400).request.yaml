$kind: http-request
url: "{{base_url}}/api/users/"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: first_name
      value: Test
    - type: text
      key: last_name
      value: AdminRole
    - type: text
      key: username
      value: pm_admin_role_{{$timestamp}}
    - type: text
      key: password
      value: Password@123
    - type: text
      key: email
      value: admin-role+{{$timestamp}}@test.local
    - type: text
      key: role
      value: admin
    - type: text
      key: phone
      value: "0900000003"
    - type: text
      key: address
      value: 789 Test street
    - type: file
      key: avatar
      src: "{{sample_image_path}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 400', () => pm.response.to.have.status(400));
      pm.test('Khong cho tu dang ky admin', () => {
          pm.expect(JSON.stringify(pm.response.json())).to.include('admin');
      });
    language: text/javascript
order: 2500
