$kind: http-request
url: "{{base_url}}/api/dishes/{{created_dish_id}}/"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 204 or 404', () => pm.expect([204, 404]).to.include(pm.response.code));
      const seedId = pm.environment.get('seed_dish_id');
      if (seedId) {
          pm.environment.set('dish_id', seedId);
      }
      pm.environment.set('created_dish_id', '');
    language: text/javascript
order: 15000
