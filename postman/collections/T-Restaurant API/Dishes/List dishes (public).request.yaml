$kind: http-request
url: "{{base_url}}/api/dishes/"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const items = body.results || body;
      pm.test('Trả danh sách dạng mảng', () => pm.expect(Array.isArray(items)).to.be.true);
      if (items.length > 0) {
          const d = items[0];
          pm.test('Có avg_rating', () => pm.expect(d).to.have.property('avg_rating'));
          pm.test('Có review_count', () => pm.expect(d).to.have.property('review_count'));
          pm.environment.set('dish_id', d.id);
          pm.environment.set('seed_dish_id', d.id);
      }
      const byCategory = {};
      items.forEach((d) => {
          if (!d.category) return;
          byCategory[d.category] = byCategory[d.category] || [];
          byCategory[d.category].push(d.id);
      });
      const sameCategoryIds = Object.values(byCategory).find((ids) => ids.length >= 2);
      if (sameCategoryIds) {
          pm.environment.set('compare_ids', sameCategoryIds.slice(0, 3).join(','));
      }
    language: text/javascript
order: 1000
