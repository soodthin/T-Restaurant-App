$kind: http-request
url: "{{base_url}}/api/dishes/{{dish_id}}/"
method: PATCH
body:
  type: formdata
  content:
    - type: text
      key: price
      value: "70000"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Giá đã đổi', () => pm.expect(Number(pm.response.json().price)).to.eql(70000));
    language: text/javascript
order: 11000
