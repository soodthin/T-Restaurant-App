$kind: http-request
name: Compare dishes (?ids=)
url: "{{base_url}}/api/dishes/compare/?ids={{compare_ids}}"
method: GET
queryParams:
  ids: "{{compare_ids}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Co it nhat 2 mon cung loai de so sanh', () => {
          const ids = (pm.collectionVariables.get('compare_ids') || '').split(',').filter(Boolean);
          pm.expect(ids.length).to.be.at.least(2);
      });
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Là mảng', () => pm.expect(pm.response.json()).to.be.an('array'));
    language: text/javascript
order: 11000
