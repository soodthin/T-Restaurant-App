$kind: http-request
url: "{{base_url}}/api/dishes/{{dish_id}}/"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Có trường price', () => pm.expect(pm.response.json()).to.have.property('price'));
    language: text/javascript
order: 6000
