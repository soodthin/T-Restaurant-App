$kind: http-request
url: "{{base_url}}/api/stripe/return/?status=cancel&session_id={{stripe_session_id}}"
method: GET
queryParams:
  status: cancel
  session_id: "{{stripe_session_id}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Returns HTML', () => {
          pm.expect(pm.response.headers.get('Content-Type') || '').to.include('text/html');
      });
    language: text/javascript
order: 3000
