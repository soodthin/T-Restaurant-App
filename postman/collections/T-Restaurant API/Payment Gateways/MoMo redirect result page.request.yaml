$kind: http-request
url: "{{base_url}}/api/momo/redirect/?requestId={{momo_request_id}}&orderId={{momo_order_id}}&resultCode=99"
method: GET
queryParams:
  requestId: "{{momo_request_id}}"
  orderId: "{{momo_order_id}}"
  resultCode: "99"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Returns HTML', () => {
          pm.expect(pm.response.headers.get('Content-Type') || '').to.include('text/html');
      });
    language: text/javascript
order: 1000
