$kind: http-request
name: Add order detail (POST .../add-detail/)
url: "{{base_url}}/api/orders/{{order_id}}/add-detail/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "dish": {{dish_id}},
        "quantity": 2,
        "unit_price": 65000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('total_amount > 0', () => pm.expect(Number(body.total_amount)).to.be.above(0));
      pm.test('details có ít nhất 1 item', () => pm.expect(body.details.length).to.be.above(0));
    language: text/javascript
order: 4000
