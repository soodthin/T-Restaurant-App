$kind: collection
description: |-
  Postman test cases for T-Restaurant App backend.

  Before running:
  1. Select environment `T-Restaurant - Production`.
  2. Backend base URL is `{{base_url}}`.
  3. Demo accounts:
     - Customer: `customer_demo` / `demo123456`
     - Chef: `chef_demo` / `demo123456`
     - Admin: `admin` / `Admin@123`
  4. Run login requests first to save token variables.
variables:
  base_url: https://t-restaurant.onrender.com
  client_id: restaurant_client_id
  client_secret: restaurant_client_secret
  customer_username: customer_demo
  customer_password: demo123456
  chef_username: chef_demo
  chef_password: demo123456
  admin_username: admin
  admin_password: Admin@123
  access_token: ""
  refresh_token: ""
  customer_access_token: ""
  customer_refresh_token: ""
  chef_access_token: ""
  admin_access_token: ""
  user_id: ""
  category_id: ""
  menu_id: ""
  dish_id: ""
  booking_id: ""
  order_id: ""
  review_id: ""
  payment_id: ""
  compare_ids: ""
  seed_category_id: ""
  seed_menu_id: ""
  seed_dish_id: ""
  created_dish_id: ""
  chef_user_id: ""
  chef_order_id: ""
  chef_order_next_status: ""
  dish_price_min: "1"
  dish_price_max: "100000000"
  dish_prep_min: "1"
  dish_prep_max: "1440"
  momo_request_id: postman-momo-request
  momo_order_id: postman-momo-order
  stripe_session_id: cs_test_postman
  sample_image_path: D:\Project\T-Restaurant-App\docs\stitch\kh_m_ph_m_th_c\screen.png
scripts:
  - type: http:beforeRequest
    code: |-
      const url = pm.request.url.toString();
      const method = pm.request.method;
      let tokenKey = '';

      if (url.includes('/api/categories/') && ['POST', 'PATCH', 'DELETE'].includes(method)) {
          tokenKey = 'admin_access_token';
      } else if (url.includes('/api/menus/') && ['POST', 'PATCH', 'DELETE'].includes(method)) {
          tokenKey = 'admin_access_token';
      } else if (url.includes('/api/users/') && (url.includes('/verify-chef/') || (method === 'GET' && url.endsWith('/api/users/')))) {
          tokenKey = 'admin_access_token';
      } else if (url.includes('/api/dishes/') && (url.includes('my=true') || url.includes('my-reviews') || ['POST', 'PATCH', 'DELETE'].includes(method))) {
          tokenKey = 'chef_access_token';
      } else if (url.includes('/api/orders/chef-orders') || url.includes('/chef-update-status/')) {
          tokenKey = 'chef_access_token';
      } else if (url.includes('/api/stats/')) {
          tokenKey = 'admin_access_token';
      } else if (url.includes('/api/payments/') && ['PATCH', 'DELETE'].includes(method)) {
          tokenKey = 'admin_access_token';
      } else if (url.includes('/api/payments/')) {
          tokenKey = 'customer_access_token';
      } else if (url.includes('/api/bookings/') || url.includes('/api/orders/') || url.includes('/api/reviews/') || url.includes('/api/users/current-user/')) {
          tokenKey = 'customer_access_token';
      }

      if (tokenKey) {
          const token = pm.environment.get(tokenKey);
          if (token) {
              pm.environment.set('access_token', token);
          }
      }
    language: text/javascript
auth:
  - id: 293a1122-efb3-4c17-876f-c17568b96267
    type: bearer
    name: bearer auth
    credentials:
      token: "{{access_token}}"
