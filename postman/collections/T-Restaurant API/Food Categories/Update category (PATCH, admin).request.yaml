$kind: http-request
url: "{{base_url}}/api/categories/{{category_id}}/"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Món nướng (updated)"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
