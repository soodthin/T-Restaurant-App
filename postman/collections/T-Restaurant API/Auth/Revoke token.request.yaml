$kind: http-request
url: "{{base_url}}/o/revoke_token/"
method: POST
headers:
  Content-Type: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    token: postman_dummy_token
    client_id: "{{client_id}}"
    client_secret: "{{client_secret}}"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test('Status 200 or 400', () => pm.expect([200, 400]).to.include(pm.response.code));
    language: text/javascript
order: 5000
