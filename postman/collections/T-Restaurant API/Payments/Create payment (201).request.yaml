$kind: http-request
url: "{{base_url}}/api/payments/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "order": {{order_id}},
        "method": "cash",
        "amount": 130000
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 201', () => pm.response.to.have.status(201));
      const body = pm.response.json();
      pm.test('Status mặc định = pending', () => pm.expect(body.status).to.eql('pending'));
      pm.environment.set('payment_id', body.id);
    language: text/javascript
order: 2000
