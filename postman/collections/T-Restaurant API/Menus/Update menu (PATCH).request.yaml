$kind: http-request
url: "{{base_url}}/api/menus/{{menu_id}}/"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "description": "Đã cập nhật"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 4000
