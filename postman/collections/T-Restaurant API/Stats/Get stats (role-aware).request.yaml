$kind: http-request
url: "{{base_url}}/api/stats/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Trả object', () => pm.expect(body).to.be.an('object'));
      // Chef: total_dishes, total_orders, revenue
      // Admin: thêm total_bookings, total_users
      // Customer (mặc định): {} rỗng
    language: text/javascript
order: 1000
