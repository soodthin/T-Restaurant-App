$kind: http-request
url: "{{base_url}}/api/reviews/mine/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      const items = body.results || body;
      pm.test('Returns list', () => pm.expect(items).to.be.an('array'));
      if (items.length > 0) {
          pm.test('Review includes dish summary fields', () => {
              pm.expect(items[0]).to.have.property('dish_name');
              pm.expect(items[0]).to.have.property('dish_image');
          });
      }
    language: text/javascript
order: 3000
